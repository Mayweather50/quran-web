<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2D5F3F" />
  <title>Админ-панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-admin">

  <header class="admin-app-header" id="siteHeader">
    <div class="container admin-app-header__inner">
      <a href="admin.html" class="admin-app-brand" aria-label="Админ-панель">
        <span class="admin-app-brand__mark"><img src="assets/images/logo.png" alt="" loading="lazy" /></span>
        <span class="admin-app-brand__name">Админ-панель</span>
      </a>
      <div class="admin-app-header__actions">
        <button class="admin-round-btn" type="button" aria-label="Поиск" data-admin-action="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="admin-round-btn" type="button" aria-label="Фильтр записей" data-admin-action="bookings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M8 12h8M10 17h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="admin-round-btn admin-round-btn--notify" type="button" aria-label="Заявки" data-admin-action="pending">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0v5l1.5 3h-15L6 13V8Z M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
        <button class="admin-round-btn" type="button" aria-label="Выйти из аккаунта" title="Выйти" data-logout>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-1 M4 12h10 M8 8l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="admin-app-main">
    <section class="admin-app-section">
      <div class="container admin-container">
        <article class="panel-page" data-render="admin-page">
          <p class="empty-state">Загрузка…</p>
        </article>
      </div>
    </section>
  </main>

  <nav class="admin-bottom-nav" aria-label="Админ-навигация">
    <button type="button" data-admin-nav="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1Z" fill="currentColor"/></svg>
      <span>Главная</span>
    </button>
    <button type="button" data-admin-nav="bookings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 3v4M16 3v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Записи</span>
    </button>
    <button type="button" data-admin-nav="attendance">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Явка</span>
    </button>
    <button type="button" data-admin-nav="reports">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      <span>Отчёты</span>
    </button>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Профиль</span>
    </a>
  </nav>

  <script src="data.js"></script>
  <script src="_config.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
