<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2D5F3F" />
  <title>Запись на урок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-booking">

  <!-- ============== HEADER ============== -->
  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="На главную">
        <span class="brand-mark"><img src="assets/images/logo.png" alt="" loading="lazy" /></span>
      </a>

      <nav class="main-nav" aria-label="Основная навигация">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="booking.html" class="nav-link active">Записи</a>
        <a href="schedule.html" class="nav-link">Расписание</a>
        <a href="teachers.html" class="nav-link">Преподаватели</a>
        <a href="#" class="nav-link">Профиль</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn" aria-label="Уведомления">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 8a6 6 0 0 1 12 0v5l1.5 3h-15L6 13V8Z M10 19a2 2 0 0 0 4 0"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="booking-main">
    <!-- ============== HERO ============== -->
    <section class="booking-hero">
      <div class="booking-hero__bg"></div>
      <div class="booking-hero__fade"></div>
      <div class="container booking-hero__inner">
        <div class="booking-hero__head">
          <h1 class="booking-hero__title" data-render="booking-title">Запись на урок</h1>
          <p class="booking-hero__subtitle" data-render="booking-subtitle">Выберите дату и удобное время</p>
        </div>
        <button class="icon-btn booking-bell" aria-label="Уведомления">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 8a6 6 0 0 1 12 0v5l1.5 3h-15L6 13V8Z M10 19a2 2 0 0 0 4 0"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </section>

    <!-- ============== CONTENT ============== -->
    <section class="booking-content">
      <div class="container booking-grid">

        <!-- LEFT: group + calendar + stats -->
        <div class="booking-col booking-col--left">
          <article class="group-card" data-render="booking-group"></article>

          <div class="booking-tabs" role="tablist">
            <button class="booking-tab active" role="tab" aria-selected="true">Календарь</button>
            <button class="booking-tab" role="tab" aria-selected="false">Список</button>
          </div>

          <article class="calendar-full" data-render="booking-calendar"></article>

          <article class="booking-stats" data-render="booking-stats"></article>
        </div>

        <!-- RIGHT: slots + teacher + cta -->
        <div class="booking-col booking-col--right">
          <section class="slots-section">
            <header class="section-head section-head--small">
              <h3 class="slots-title" data-render="slots-title">Доступное время</h3>
              <a href="#" class="see-all-link">Смотреть все</a>
            </header>
            <div class="slots-grid" data-render="booking-slots"></div>
          </section>

          <article class="teacher-card" data-render="booking-teacher"></article>

          <div class="booking-cta-wrap">
            <button class="booking-cta" data-render="booking-cta-label">
              <svg class="cta-spark" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6Z M18 14l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9Z" fill="currentColor" />
              </svg>
              <span data-render="cta-label">Записаться</span>
            </button>
            <p class="booking-note">
              <svg class="lock-ic" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <span data-render="cta-note">После подтверждения урок появится в расписании</span>
            </p>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- ============== FOOTER ============== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark"><img src="assets/images/logo.png" alt="" loading="lazy" /></span>
      </a>
      <nav class="footer-nav">
        <a href="index.html">Главная</a>
        <a href="schedule.html">Записи</a>
        <a href="teachers.html">Преподаватели</a>
        <a href="#">Профиль</a>
      </nav>
      <span class="footer-copy">© 2026</span>
    </div>
  </footer>

  <!-- ============== MOBILE BOTTOM NAV ============== -->
  <nav class="mobile-tabs" aria-label="Мобильная навигация">
    <a class="tab" href="index.html">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11 12 4l8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1Z" fill="currentColor" />
        </svg>
      </span>
      <span class="tab-label">Главная</span>
    </a>
    <a class="tab active" href="booking.html">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M3.5 10h17 M8 3v4 M16 3v4 M12 13v5 M9.5 15.5h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </span>
      <span class="tab-label">Записи</span>
    </a>
    <a class="tab" href="schedule.html">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M3.5 10h17 M8 3v4 M16 3v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </span>
      <span class="tab-label">Расписание</span>
    </a>
    <a class="tab" href="teachers.html">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7" />
          <circle cx="17" cy="9.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5 M14.5 19c.3-2.4 2-3.7 4.5-3.7s3.5 1.3 3.8 3.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </span>
      <span class="tab-label">Преподаватели</span>
    </a>
    <a class="tab" href="#">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </span>
      <span class="tab-label">Профиль</span>
    </a>
  </nav>

  <script src="data.js"></script>
  <script src="_config.js"></script>
  <script src="api.js"></script>
  <script src="script.js"></script>
</body>
</html>
