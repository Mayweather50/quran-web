# =============================================================
# Netlify configuration for the static frontend.
#
# Netlify only hosts static files — Express + PostgreSQL are NOT
# deployed here. Deploy backend/ separately, then set API_BASE in
# Netlify (Site settings → Build & deploy → Env), for example:
#   API_BASE=https://hifz-center-api.onrender.com/api
# =============================================================

[build]
  publish = "."
  # The "build" step injects the API_BASE env var into a tiny config
  # file that index.html loads before api.js. Idempotent: writes the
  # same content on every deploy.
  command = """
    if [ -n "$API_BASE" ]; then
      echo "window.__API_BASE__ = '$API_BASE';" > _config.js
    else
      echo "/* no API_BASE configured */" > _config.js
    fi
  """

# SPA-style routing fallback: send unknown paths to index.html so deep links
# such as /teachers.html?level=Базовый still load on direct visit.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
  force = false
